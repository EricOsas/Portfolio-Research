name: Build platform equity reports

on:
  push:
    branches: [main]
    paths:
      # Current source layout. Broad parent pattern also catches future subfolders.
      - "Trades/**"
      # Legacy paths retained so older branches still trigger a rebuild.
      - "NT8 Trades/**"
      - "MT5 Trades/**"
      - "analysis/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-research-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Build platform reports and equity curves
        run: python analysis/build_equity_reports.py
      - name: Inspect MT5 export schemas
        run: python analysis/inspect_mt5_headers.py
      - name: Build normalized live and prop-firm research
        run: python analysis/build_live_and_prop_reports.py
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NT8 MT5 Normalized-Live Prop-Firms reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh platform equity reports [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push raced with another main update; retrying ($attempt/5)."
              sleep 2
            done
            exit 1
          else
            echo "No report changes to commit."
          fi
