name: Build platform equity reports

on:
  push:
    branches: [main]
    paths:
      - "NT8 Trades/**"
      - "MT5 Trades/**"
      - "analysis/**"
      - ".github/workflows/build-equity-reports.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install analysis dependencies
        run: python -m pip install -r analysis/requirements.txt
      - name: Build platform reports and equity curves
        run: python analysis/build_equity_reports.py
      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NT8 MT5 reports
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh platform equity reports [skip ci]"
            git push
          else
            echo "No report changes to commit."
          fi
